// =====================================

function searchBible() {


    const search =

        document
        .getElementById("bibleSearch")
        .value
        .toLowerCase();


    const books =

        document
        .querySelectorAll(".books-grid button");


    books.forEach(book => {


        const name =

            book
            .textContent
            .toLowerCase();


        if (name.includes(search)) {

            book.style.display = "block";

        }

        else {

            book.style.display = "none";

        }


    });


}

// =====================================
// OPEN BOOK
// =====================================

function openBook(bookId) {


    const bookName =
        bookNames[bookId];


    const totalChapters =
        chapterCounts[bookId];


    const bookTitle =
        document
        .getElementById("selectedBookName");


    const chaptersGrid =
        document
        .getElementById("chaptersGrid");


    const chapterSection =
        document
        .getElementById("chapterSection");


    const verseSection =
        document
        .getElementById("verseSection");



    // BOOK TITLE

    bookTitle.textContent =
        "📖 " + bookName;



    // CLEAR OLD CHAPTERS

    chaptersGrid.innerHTML = "";



    // CREATE CHAPTER BUTTONS

    for (
        let chapter = 1;
        chapter <= totalChapters;
        chapter++
    ) {


        const button =
            document.createElement("button");


        button.textContent =
            "అధ్యాయం " + chapter;


        button.onclick = function () {


            openChapter(
                bookId,
                chapter
            );


        };


        chaptersGrid.appendChild(button);


    }



    // SHOW CHAPTER SECTION

    chapterSection.style.display =
        "block";


    // HIDE VERSES

    verseSection.style.display =
        "none";



    // SCROLL

    chapterSection.scrollIntoView({

        behavior: "smooth"

    });


}



// =====================================
// OPEN CHAPTER
// =====================================

function openChapter(
    bookId,
    chapterNumber
) {


    const verseSection =
        document
        .getElementById("verseSection");


    const chapterTitle =
        document
        .getElementById("selectedChapterName");


    const versesContainer =
        document
        .getElementById("versesContainer");



    chapterTitle.textContent =

        "📖 " +
        bookNames[bookId] +
        " — అధ్యాయం " +
        chapterNumber;



    // TEMPORARY VERSE

    versesContainer.innerHTML = `

        <div class="verse">

            <span class="verse-number">
                1
            </span>

            <span class="verse-text">

                ఈ అధ్యాయం యొక్క బైబిల్ వచనాలు
                త్వరలో ఇక్కడ కనిపిస్తాయి.

            </span>

        </div>

    `;



    verseSection.style.display =
        "block";



    verseSection.scrollIntoView({

        behavior: "smooth"

    });


}
