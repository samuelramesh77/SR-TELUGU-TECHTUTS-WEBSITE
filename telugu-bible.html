    <script>

        function searchBible() {

            const search =
                document.getElementById("bibleSearch").value
                .toLowerCase();

            const books =
                document.querySelectorAll(".books-grid button");

            books.forEach(book => {

                const name =
                    book.textContent.toLowerCase();

                if (name.includes(search)) {

                    book.style.display = "block";

                } else {

                    book.style.display = "none";

                }

            });

        }

// =====================================
// OPEN BOOK
// =====================================

function openBook(bookId) {

    const bookName = bookNames[bookId];

    const totalChapters = chapterCounts[bookId];

    const bookTitle =
        document.getElementById("selectedBookName");

    const chaptersGrid =
        document.getElementById("chaptersGrid");

    const chapterSection =
        document.getElementById("chapterSection");

    const verseSection =
        document.getElementById("verseSection");


    // Book name
    bookTitle.textContent =
        "📖 " + bookName;


    // Clear old chapters
    chaptersGrid.innerHTML = "";


    // Create chapter buttons
    for (
        let chapter = 1;
        chapter <= totalChapters;
        chapter++
    ) {

        const button =
            document.createElement("button");

        button.textContent =
            chapter;

        button.onclick = function () {

            openChapter(
                bookId,
                chapter
            );

        };

        chaptersGrid.appendChild(button);
    }


    // Show chapter section
    chapterSection.style.display =
        "block";


    // Hide verses until chapter selected
    verseSection.style.display =
        "none";


    // Scroll to chapters
    chapterSection.scrollIntoView({
        behavior: "smooth"
    });

}
